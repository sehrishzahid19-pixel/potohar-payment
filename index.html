<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Potohar Jeweller - Payment Details</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fffaf0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border: 2px solid #d4af37;
            border-radius: 25px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(180, 140, 40, 0.20);
        }

        /* Logo */
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: white;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 29px;
            color: #b8860b;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .brand {
            color: #555;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 15px;
            margin-bottom: 25px;
        }

        /* Account Cards */
        .account {
            text-align: left;
            background: #fffdf7;
            border: 1px solid #dfc568;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 17px;
            box-shadow: 0 4px 12px rgba(180, 140, 40, 0.08);
        }

        .account h2 {
            font-family: Georgia, serif;
            color: #b8860b;
            font-size: 21px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eadca5;
        }

        .detail {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .value {
            display: block;
            color: #222;
            font-size: 18px;
            font-weight: bold;
            margin-top: 3px;
        }

        .footer {
            margin-top: 20px;
            color: #888;
            font-size: 12px;
            line-height: 1.5;
        }

        .tagline {
            margin-top: 15px;
            color: #b8860b;
            font-family: Georgia, serif;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .gold-line {
            width: 80%;
            height: 3px;
            margin: 0 auto 25px;
            background: linear-gradient(
                to right,
                #b8860b,
                #f1d477,
                #b8860b
            );
            border-radius: 10px;
        }

        .bottom-line {
            width: 80%;
            height: 3px;
            margin: 20px auto 0;
            background: linear-gradient(
                to right,
                #b8860b,
                #f1d477,
                #b8860b
            );
            border-radius: 10px;
        }

        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            .container {
                padding: 25px 18px;
            }

            h1 {
                font-size: 25px;
            }

            .value {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="gold-line"></div>

        <!-- Logo -->
        <div class="logo">
            <img src="potohar_pj_logo.png" alt="Potohar Jeweller Logo">
        </div>

        <h1>Potohar Jeweller</h1>

        <p class="brand">
            Jeweller Hub
        </p>

        <p class="subtitle">
            Payment Account Details
        </p>


        <!-- JazzCash -->
        <div class="account">

            <h2>JazzCash</h2>

            <p class="detail">
                Account Name
                <span class="value">
                    MUJAHID HUSSAIN
                </span>
            </p>

            <p class="detail">
                Account Number
                <span class="value">
                    03465002926
                </span>
            </p>

        </div>


        <!-- Easypaisa -->
        <div class="account">

            <h2>Easypaisa</h2>

            <p class="detail">
                Account Name
                <span class="value">
                    ATIF RAZZAQ
                </span>
            </p>

            <p class="detail">
                Account Number
                <span class="value">
                    03355397305
                </span>
            </p>

        </div>


        <p class="footer">
            Please verify the account name and number
            before making a payment.
        </p>

        <p class="tagline">
            Trust • Purity • Elegance
        </p>

        <div class="bottom-line"></div>

    </div>

</body>
</html>
